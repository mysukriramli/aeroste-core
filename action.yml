name: 'AeroSTE Compliance Check'
description: 'Lints technical documentation and aerospace manuals for ASD-STE100 compliance.'
inputs:
  path:
    description: 'Path or glob to scan'
    required: true
    default: 'docs/**/*.md'
  profile:
    description: 'Strictness profile (general | technical | aerospace_ste)'
    required: false
    default: 'technical'
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: |
        python -m pip install git+https://github.com/mysukriramli/aeroste-core.git
        aeroste check ${{ inputs.path }} --profile ${{ inputs.profile }}
