[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroste-core"
version = "1.1.0"
description = "Multi-tier controlled language compliance, ASD-STE100 linting, and spatial telemetry engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mysukriramli" }]
keywords = ["aerospace", "asd-ste100", "nlp", "controlled-language", "fastapi", "agents"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "h3>=4.1.0"
]

[project.scripts]
aeroste = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "rules*", "scripts*"]
