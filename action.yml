name: 'AeroSTE Compliance Action'
description: 'Autonomous multi-tier controlled language linter and ASD-STE100 validator.'
author: 'mysukriramli'

inputs:
  path:
    description: 'Path or file to audit'
    required: true
    default: 'input/'
  profile:
    description: 'Compliance strictness profile (general, technical, aerospace_ste)'
    required: false
    default: 'aerospace_ste'
  sarif_output:
    description: 'Path to save SARIF report (optional)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install AeroSTE-Core
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/mysukriramli/aeroste-core.git

    - name: Run AeroSTE Audit
      shell: bash
      run: |
        if [ -n "${{ inputs.sarif_output }}" ]; then
          aeroste check "${{ inputs.path }}" --profile "${{ inputs.profile }}" --sarif > "${{ inputs.sarif_output }}"
        else
          aeroste check "${{ inputs.path }}" --profile "${{ inputs.profile }}"
        fi
